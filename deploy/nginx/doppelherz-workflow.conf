# /etc/nginx/sites-available/dh-robot-jiudi — TLS is added by: certbot --nginx -d <domain> --redirect
server {
    listen 80;
    listen [::]:80;
    server_name doppelherz-workflow.jiudi.cloud;

    client_max_body_size 5m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Public n8n webhooks (WordPress → n8n); the n8n editor itself stays on 127.0.0.1
    location /n8n-webhook/ {
        proxy_pass http://127.0.0.1:5678/webhook/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8141;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
