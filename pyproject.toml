[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doppelherz-workflow"
version = "1.0.0"
description = "AI content robot that turns doppelherz.vn articles into Facebook posts and Pinterest pins with Claude, Vietnamese health-supplement ad-compliance checks, human approval, scheduling and reporting."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vu Duy Bach", email = "vuduybachvp@gmail.com" }]
keywords = ["claude", "anthropic", "n8n", "wordpress", "facebook-graph-api", "pinterest-api", "content-automation", "compliance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Operating System :: OS Independent",
]
dependencies = [
  "anthropic>=2.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pillow>=10.0",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
content-robot = "content_robot.__main__:main"

[project.urls]
"Live demo" = "https://doppelherz-workflow.jiudi.cloud"
Repository = "https://github.com/Bachthutruong/doppelherz-workflow"
Documentation = "https://github.com/Bachthutruong/doppelherz-workflow/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
content_robot = ["templates/*.html", "static/*", "assets/fonts/*", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B904"]
